<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tagisan 41 Quiz Show - Player Buzzer</title>
    <link rel="stylesheet" href="tagisan.css">
    <!-- Preload buzzer faces so state changes never flash blank -->
    <link rel="preload" as="image" href="assets/buzzer/buzzer-ready.png">
    <link rel="preload" as="image" href="assets/buzzer/buzzer-buzzed.png">
    <link rel="preload" as="image" href="assets/buzzer/buzzer-locked.png">
    <style>
        body {
            display: flex;  
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 16px 20px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--red);
            padding-bottom: 12px;
        }

        .player-tag {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .player-tag span {
            color: var(--red);
        }

        .player-tag .player-badge-pill,
        .player-tag .player-badge-pill span {
            color: var(--cream);
        }

        .player-badge-pill {
            background-color: var(--red);
            padding: 2px 8px;
            display: inline-block;
            margin-left: 6px;
        }

        .footer-info {
            font-family: var(--font-display);
            font-size: 0.8rem;
            color: var(--red);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 8px 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="player-tag">
            <span id="displaySchool">Loading School...</span>
            <span class="player-badge-pill">#<span id="displayNumber">0</span></span>
        </div>
        <a href="#" onclick="confirmLeave(event)" class="back-link">Leave</a>
    </div>

    <div class="buzzer-container">
        <!-- Status Banner: Torn Paper Tape Strip -->
        <div id="statusBanner" class="status-banner">LOCKED OUT</div>
        
        <!-- The Giant Responsive Buzzer Disc -->
        <button id="buzzerBtn" class="buzzer-btn locked" aria-label="Buzz" disabled onclick="pressBuzzer()">BUZZ</button>
    </div>

    <div class="footer-info">
        Tagisan 41 Quiz Show &bull; UP Kalilayan
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const school = localStorage.getItem('quizPlayerSchool') || 'Unknown School';
        const number = localStorage.getItem('quizPlayerNumber') || '1';

        document.getElementById('displaySchool').textContent = school;
        document.getElementById('displayNumber').textContent = number;

        let buzzerState = 'locked';

        // Re-register player on load in case they refreshed
        socket.emit('playerJoin', { school: school, number: number });

        // Listen for state updates from the server
        socket.on('updateState', (gameState) => {
            const me = gameState.players.find(p => p.school === school && p.number == number);
            if (me) {
                buzzerState = me.status; // 'ready', 'buzzed', or 'locked'
                updateBuzzerUI();
            }
        });

        function pressBuzzer() {
            if (buzzerState !== 'ready') return;

            playSound('buzz'); // Play local sound immediately
            triggerVibration(200);

            socket.emit('playerBuzz');
        }

        // Initialize the browser's Audio Context
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Programmatically synthesize quiz show sounds
        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'buzz') {
                // Sharp Arcade Buzzer Beep
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(160, now + 0.25);
                
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                
                osc.start(now);
                osc.stop(now + 0.25);
            } 
            else if (type === 'correct') {
                // Pleasant Upward Chime (Major Arpeggio)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);       // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                
                osc.start(now);
                osc.stop(now + 0.45);
            } 
            else if (type === 'wrong') {
                // Low Descending Error Thud/Buzz
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        // Helper for haptic vibration
        function triggerVibration(pattern = 200) {
            if ("vibrate" in navigator) {
                try {
                    navigator.vibrate(pattern);
                } catch (err) {
                    console.log("Vibration not supported or blocked:", err);
                }
            }
        }

        function handleBuzz() {
            triggerVibration(200); // 200ms pulse
            socket.emit('playerBuzz');
        }

        function updateBuzzerUI() {
            const btn = document.getElementById('buzzerBtn');
            const banner = document.getElementById('statusBanner');

            btn.className = 'buzzer-btn';

            if (buzzerState === 'ready') {
                btn.disabled = false;
                banner.textContent = "READY";
                banner.style.color = "var(--red)";
                banner.style.backgroundColor = "var(--tape)";
                banner.style.borderColor = "var(--red)";
            } else if (buzzerState === 'buzzed') {
                btn.classList.add('buzzed');
                btn.disabled = true;
                banner.textContent = "YOU BUZZED FIRST!";
                banner.style.color = "var(--cream)";
                banner.style.backgroundColor = "var(--red)";
                banner.style.borderColor = "var(--cream)";
            } else if (buzzerState === 'locked') {
                btn.classList.add('locked');
                btn.disabled = true;
                banner.textContent = "LOCKED OUT";
                banner.style.color = "var(--halftone)";
                banner.style.backgroundColor = "var(--newsprint)";
                banner.style.borderColor = "var(--halftone)";
            }
        }

        let previousBuzzerState = 'locked';

        socket.on('updateState', (gameState) => {
            const me = gameState.players.find(p => p.school === school && p.number == number);
            if (me) {
                buzzerState = me.status;
                previousBuzzerState = buzzerState;
                updateBuzzerUI();
            }
        });

        function confirmLeave(event) {
            event.preventDefault();
            if (confirm("Are you sure you want to leave?")) {
                // Disconnect socket explicitly before leaving
                socket.disconnect();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
