<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tagisan 41 Quiz Show - Player Buzzer</title>
    <link rel="stylesheet" href="tagisan.css">
    <!-- Preload buzzer faces so state changes never flash blank -->
    <link rel="preload" as="image" href="assets/buzzer/rm-ready.png">
    <link rel="preload" as="image" href="assets/buzzer/rm-buzzed.png">
    <link rel="preload" as="image" href="assets/buzzer/rm-locked.png">
    <style>
        body {
            display: flex;  
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px 20px 0 20px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overscroll-behavior-y: contain;
            animation: paperGrainDrift 24s linear infinite;
        }

        @keyframes paperGrainDrift {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 32px 32px, -32px -32px, 40px 40px; }
        }

        .header {
            width: 100%;
            max-width: 480px;
            display: grid;
            grid-template-columns: 58px 1fr 58px;
            align-items: center;
            gap: 12px;
            border-bottom: 3px solid var(--red);
            padding-bottom: 12px;
        }

        .header .number-box {
            width: 58px;
            min-width: 58px;
            padding: 8px 6px;
            font-size: 1.05rem;
            text-align: center;
        }

        .player-tag {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: -0.02em;
            line-height: 1.1;
            text-align: center;
        }

        .header-right {
            width: 58px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .footer-info {
            font-family: var(--font-display);
            font-size: 0.8rem;
            color: var(--red);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 8px 0;
            opacity: 0.9;
        }
    </style>
</head>
<!-- Remove "use-page-bg" below to disable assets/bg/player-bg.png on this page -->
<body class="page-player use-page-bg">

    <div class="header">
        <div class="number-box">#<span id="displayNumber">0</span></div>
        <div class="player-tag">
            <span id="displaySchool">Loading School...</span>
        </div>
        <div class="header-right">
            <button type="button" id="fullscreenBtn" class="fullscreen-btn hidden" aria-label="Enter fullscreen" title="Fullscreen">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
            </button>
        </div>
        <!-- hide leave button -->
        <!-- <a href="#" onclick="confirmBackToMainMenu(event)" class="back-link">Leave</a> -->
    </div>
    
    <div class="buzzer-container">
        <!-- Status Banner: Torn Paper Tape Strip -->
        <div id="statusBanner" class="status-banner">LOCKED OUT</div>
        
        <!-- The Giant Responsive Buzzer Disc -->
        <button id="buzzerBtn" class="buzzer-btn locked" aria-label="Buzz" disabled onclick="pressBuzzer()">BUZZ</button>
    </div>

    <div class="footer-info">
        Tagisan 41 &bull; UP Kalilayan
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="back-navigation.js"></script>
    <script src="client-utils.js"></script>
    <script>
        // ====================================================
        // 1. SESSION & CONNECTION SETUP
        // ====================================================
        const socket = io();
        setupBackToMenuFallback({ getSocket: () => socket });
        setupFullscreenButton('fullscreenBtn');

        const school = localStorage.getItem('quizPlayerSchool') || 'Unknown School';
        const number = localStorage.getItem('quizPlayerNumber') || '1';

        document.getElementById('displaySchool').textContent = school;
        document.getElementById('displayNumber').textContent = number;

        let buzzerState = 'locked';
        let hasPendingBuzz = false;

        // Re-register on initial connect and any automatic Socket.IO reconnects
        socket.on('connect', () => {
            hasPendingBuzz = false;
            socket.emit('playerJoin', { school, number });
        });

        socket.on('disconnect', () => {
            hasPendingBuzz = false;
        });

        socket.on('joinError', (err) => {
            alert((err && err.message) || 'This school is already active in the game.');
            localStorage.removeItem('quizPlayerSchool');
            localStorage.removeItem('quizPlayerNumber');
            socket.disconnect();
            window.location.replace('index.html');
        });

        // ====================================================
        // 2. GAME STATE SYNC & BUZZER ACTION
        // ====================================================
        socket.on('updateState', (gameState) => {
            const normalizedSchool = school.trim().toLowerCase();
            const me = gameState.players.find(
                p => p.id === socket.id || String(p.school || '').trim().toLowerCase() === normalizedSchool
            );
            if (me) {
                buzzerState = me.status; // 'ready' | 'buzzed' | 'locked'
                if (buzzerState !== 'ready') {
                    hasPendingBuzz = false;
                }
                updateBuzzerUI();
            }
        });

        function pressBuzzer() {
            if (buzzerState !== 'ready' || hasPendingBuzz) return;

            hasPendingBuzz = true;
            // Play sound and trigger haptic vibration synchronously inside the click gesture
            // so iOS Safari (Web Audio) and Android browsers (vibrate + audio) never block them.
            unlockAudio();
            playSound('buzz');
            triggerVibration(200);
            socket.emit('playerBuzz');
        }

        function updateBuzzerUI() {
            const btn = document.getElementById('buzzerBtn');
            const banner = document.getElementById('statusBanner');

            btn.classList.remove('buzzed', 'locked');

            if (buzzerState === 'ready') {
                btn.disabled = false;
                banner.textContent = "READY";
                banner.style.color = "var(--red)";
                banner.style.backgroundColor = "var(--tape)";
                banner.style.borderColor = "var(--red)";
            } else if (buzzerState === 'buzzed') {
                btn.classList.add('buzzed');
                btn.disabled = true;
                banner.textContent = "YOU BUZZED FIRST!";
                banner.style.color = "var(--cream)";
                banner.style.backgroundColor = "var(--red)";
                banner.style.borderColor = "var(--cream)";
            } else if (buzzerState === 'locked') {
                btn.classList.add('locked');
                btn.disabled = true;
                banner.textContent = "LOCKED OUT";
                banner.style.color = "var(--halftone)";
                banner.style.backgroundColor = "var(--newsprint)";
                banner.style.borderColor = "var(--halftone)";
            }
        }
    </script>
</body>
</html>
