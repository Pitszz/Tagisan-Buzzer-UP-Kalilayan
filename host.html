<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagisan 41 Quiz Show - Host Control Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111827;
            --card-bg: #f9fafb;
            --border-color: #e5e7eb;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --lock-color: #d97706;
            --danger-color: #dc2626;
            --success-color: #16a34a;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            padding-bottom: 110px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header-top h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .game-title-input {
            font-size: 1rem;
            font-weight: 600;
            padding: 8px 14px;
            background: #ffffff;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 260px;
            outline: none;
        }
        .game-title-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .back-link {
            font-size: 0.85rem;
            color: var(--primary-color);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 8px;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        /* Minimal Bottom Popup for Active Raiser (No glowing red border) */
        .active-raiser-popup {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 760px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            z-index: 99;
        }

        .active-raiser-popup.hidden {
            display: none !important;
        }

        .raiser-info-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .raiser-tag {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--danger-color);
        }

        .raiser-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-color);
        }

        .raiser-actions {
            display: flex;
            gap: 8px;
        }

        .btn-eval {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .btn-eval:hover { opacity: 0.9; }
        .btn-eval.correct { background-color: var(--success-color); }
        .btn-eval.wrong { background-color: var(--danger-color); }

        /* Card Section */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
        }

        h2 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #4b5563;
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Player Row Layout */
        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .number-box {
            background-color: #f3f4f6;
            color: #1f2937;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 0; /* Adjusted padding to let min-width control horizontal space uniformly */
            min-width: 52px; /* Uniform width for both 1-digit and 2-digit numbers */
            text-align: center;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: inline-block;
        }

        .player-info-text span {
            font-size: 1rem;
            font-weight: 700;
            display: block;
            color: var(--text-color);
        }

        .player-status-sub {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 2px;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
        }
        .player-status-sub.ready { background: #dcfce7; color: #166534; }
        .player-status-sub.buzzed { background: #fee2e2; color: #991b1b; }
        .player-status-sub.locked { background: #f3f4f6; color: #4b5563; }

        .player-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .score-block {
            text-align: right;
        }
        .score-label {
            font-size: 0.7rem;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 600;
        }
        .score-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-color);
        }

        .score-controls {
            display: flex;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .btn-score {
            width: 34px;
            height: 36px;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-score:hover {
            background: #f3f4f6;
        }
        .btn-score:first-child {
            border-right: 1px solid var(--border-color);
        }

        /* Master Control Bar */
        .master-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 760px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .control-btns-left {
            display: flex;
            gap: 10px;
        }

        button.control-btn {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        button.control-btn:hover { opacity: 0.9; }
        button.control-btn.lock { background-color: var(--lock-color); }
        button.control-btn.unlock { background-color: var(--primary-color); }
        button.control-btn.reset { background-color: var(--danger-color); }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <a href="#" onclick="confirmLeaveHost(event)" class="back-link">Back to Menu</a>
            <div class="header-top">
                <h1>Host Dashboard</h1>
                <input type="text" id="gameTitleInput" class="game-title-input" value="Tagisan 41 Quiz Show" onchange="updateGameTitle()">
            </div>
        </div>

        <!-- Connected Players Panel -->
        <div class="card">
            <h2>Quiz Show Finalists</h2>
            <div id="playerList" class="player-list">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Minimal Bottom Popup for Active Raiser -->
    <div id="activeRaiserPopup" class="active-raiser-popup hidden">
        <div class="raiser-info-left">
            <span class="raiser-tag">Buzzed</span>
            <div id="raiserNameDisplay" class="raiser-name">School Name (#1)</div>
        </div>
        <div class="raiser-actions">
            <button class="btn-eval correct" onclick="handleCorrectBuzzer()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Correct
            </button>
            <button class="btn-eval wrong" onclick="handleWrongBuzzer()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Wrong
            </button>
        </div>
    </div>

    <!-- Master Control Bar at Bottom -->
    <div class="master-controls">
        <div class="control-btns-left">
            <button class="control-btn lock" onclick="lockAllPlayers()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Lock All
            </button>
            <button class="control-btn unlock" onclick="unlockAllPlayers()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
                Unlock All
            </button>
        </div>
        <button class="control-btn reset" onclick="confirmResetScores()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            Reset Scores
        </button>
    </div>

    <script>
        const socket = io();
        let gameState = { title: "Tagisan 41 Quiz Show", players: [] };

        socket.on('updateState', (serverState) => {
            gameState = serverState;
            
            const titleInput = document.getElementById('gameTitleInput');
            if (titleInput && gameState.title && titleInput.value !== gameState.title) {
                titleInput.value = gameState.title;
            }

            renderHostPanel();
        });

        function confirmLeaveHost(event) {
            event.preventDefault();
            if (confirm("Are you sure you want to go back to main menu?")) {
                // Clear any leftover player session tokens so it doesn't trigger player reconnection
                localStorage.removeItem('quizPlayerSchool');
                localStorage.removeItem('quizPlayerNumber');

                // Disconnect socket and redirect
                if (typeof socket !== 'undefined') socket.disconnect();
                window.location.href = 'index.html';
            }
        }

        function renderHostPanel() {
            const listEl = document.getElementById('playerList');
            const raiserPopup = document.getElementById('activeRaiserPopup');
            const raiserNameDisplay = document.getElementById('raiserNameDisplay');
            if (!listEl) return;
            
            listEl.innerHTML = '';

            const buzzedPlayer = gameState.players.find(p => p.status === 'buzzed');

            if (buzzedPlayer) {
                raiserPopup.classList.remove('hidden');
                raiserNameDisplay.textContent = `${buzzedPlayer.school} (#${buzzedPlayer.number})`;
            } else {
                raiserPopup.classList.add('hidden');
            }

            if (!gameState.players || gameState.players.length === 0) {
                listEl.innerHTML = `
                    <div class="player-row" style="justify-content: center; color: #9ca3af; font-style: italic; border: none; background: transparent;">
                        Waiting for teams to join... No active connections yet.
                    </div>`;
                return;
            }

            gameState.players.forEach((p, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';

                let statusClass = 'ready';
                let statusText = 'Ready';
                if (p.status === 'buzzed') {
                    statusClass = 'buzzed';
                    statusText = 'Buzzed';
                } else if (p.status === 'locked') {
                    statusClass = 'locked';
                    statusText = 'Locked';
                }

                row.innerHTML = `
                    <div class="player-left">
                        <div class="number-box">#${String(p.number)}</div>
                        <div class="player-info-text">
                            <span>${p.school}</span>
                            <div class="player-status-sub ${statusClass}">${statusText}</div>
                        </div>
                    </div>
                    <div class="player-right">
                        <div class="score-block">
                            <div class="score-label">Score</div>
                            <div class="score-val">${p.score || 0}</div>
                        </div>
                        <div class="score-controls">
                            <button class="btn-score" onclick="adjustScore(${index}, -1)">-</button>
                            <button class="btn-score" onclick="adjustScore(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function handleCorrectBuzzer() {
            // Call sound and vibration for a correct answer
            playSound('correct');
            triggerVibration([100, 50, 100]); // double pulse

            socket.emit('hostAction', { type: 'correct' });
        }

        function handleWrongBuzzer() {
            // Call sound and vibration for a wrong answer
            playSound('wrong');
            triggerVibration(400); // longer single pulse

            socket.emit('hostAction', { type: 'wrong' });
        }

        function updateGameTitle() {
            const val = document.getElementById('gameTitleInput').value;
            socket.emit('hostAction', { type: 'updateTitle', title: val });
        }

        function adjustScore(index, delta) {
            socket.emit('hostAction', { type: 'adjustScore', index: index, delta: delta });
        }

        function lockAllPlayers() {
            socket.emit('hostAction', { type: 'lockAll' });
        }

        function unlockAllPlayers() {
            socket.emit('hostAction', { type: 'unlockAll' });
        }

        function handleCorrectBuzzer() {
            socket.emit('hostAction', { type: 'correct' });
        }

        function handleWrongBuzzer() {
            socket.emit('hostAction', { type: 'wrong' });
        }

        function confirmResetScores() {
            if (confirm("Are you sure you want to reset all player scores to 0?")) {
                socket.emit('hostAction', { type: 'resetScores' });
            }
        }
    </script>
</body>
</html>
