<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagisan 41 Quiz Show - Host Control Panel</title>
    <link rel="stylesheet" href="tagisan.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px 20px;
        }

        .container {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            padding-bottom: 120px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--red);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-top h1 {
            font-size: 1.6rem;
            text-align: left;
            margin: 0;
        }

        .card-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--red);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .card-header-bar h2 {
            margin: 0;
            font-size: 1.15rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <a href="#" onclick="confirmLeaveHost(event)" class="back-link">
                &larr; Back to Menu
            </a>
            <div class="header-top">
                <h1>Host Dashboard</h1>
                <input type="text" id="gameTitleInput" class="game-title-input" value="Tagisan 41 Quiz Show" onchange="updateGameTitle()">
            </div>
        </div>

        <!-- Connected Players Panel -->
        <div class="card card-taped">
            <div class="card-header-bar">
                <h2>Quiz Show Finalists</h2>
                <span class="tape-strip" style="font-size: 0.75rem;">LIVE COMPETITION</span>
            </div>
            <div id="playerList" class="player-list">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Red Ink Bar Bottom Popup for Active Raiser -->
    <div id="activeRaiserPopup" class="active-raiser-popup hidden">
        <div class="raiser-info-left">
            <span class="raiser-tag">BUZZED FIRST</span>
            <div id="raiserNameDisplay" class="raiser-name">School Name (#1)</div>
        </div>
        <div class="raiser-actions">
            <button class="btn-eval correct" onclick="handleCorrectBuzzer()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Correct
            </button>
            <button class="btn-eval wrong" onclick="handleWrongBuzzer()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Wrong
            </button>
        </div>
    </div>

    <!-- Master Control Bar at Bottom -->
    <div class="master-controls">
        <button class="control-btn lock" onclick="lockAllPlayers()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Lock All
        </button>
        <button class="control-btn unlock" onclick="unlockAllPlayers()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
            </svg>
            Unlock All
        </button>
        <button class="control-btn reset" onclick="confirmResetScores()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Reset Scores
        </button>
    </div>

    <script>
        const socket = io();
        let gameState = { title: "Tagisan 41 Quiz Show", players: [] };

        socket.on('updateState', (serverState) => {
            gameState = serverState;
            
            const titleInput = document.getElementById('gameTitleInput');
            if (titleInput && gameState.title && titleInput.value !== gameState.title) {
                titleInput.value = gameState.title;
            }

            renderHostPanel();
        });

        function confirmLeaveHost(event) {
            event.preventDefault();
            if (confirm("Are you sure you want to go back to main menu?")) {
                // Clear any leftover player session tokens so it doesn't trigger player reconnection
                localStorage.removeItem('quizPlayerSchool');
                localStorage.removeItem('quizPlayerNumber');

                // Disconnect socket and redirect
                if (typeof socket !== 'undefined') socket.disconnect();
                window.location.href = 'index.html';
            }
        }

        function renderHostPanel() {
            const listEl = document.getElementById('playerList');
            const raiserPopup = document.getElementById('activeRaiserPopup');
            const raiserNameDisplay = document.getElementById('raiserNameDisplay');
            if (!listEl) return;
            
            listEl.innerHTML = '';

            const buzzedPlayer = gameState.players.find(p => p.status === 'buzzed');

            if (buzzedPlayer) {
                raiserPopup.classList.remove('hidden');
                raiserNameDisplay.textContent = `${buzzedPlayer.school} (#${buzzedPlayer.number})`;
            } else {
                raiserPopup.classList.add('hidden');
            }

            if (!gameState.players || gameState.players.length === 0) {
                listEl.innerHTML = `
                    <div class="player-row" style="justify-content: center; color: var(--halftone); font-style: italic; border: 2px dashed var(--newsprint); background: transparent; box-shadow: none;">
                        Waiting for teams to join... No active connections yet.
                    </div>`;
                return;
            }

            gameState.players.forEach((p, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';

                let statusClass = 'ready';
                let statusText = 'Ready';
                if (p.status === 'buzzed') {
                    statusClass = 'buzzed';
                    statusText = 'Buzzed';
                } else if (p.status === 'locked') {
                    statusClass = 'locked';
                    statusText = 'Locked';
                }

                row.innerHTML = `
                    <div class="player-left">
                        <div class="number-box">#${String(p.number)}</div>
                        <div class="player-info-text">
                            <span>${p.school}</span>
                            <div class="player-status-sub ${statusClass}">${statusText}</div>
                        </div>
                    </div>
                    <div class="player-right">
                        <div class="score-block">
                            <div class="score-label">Score</div>
                            <div class="score-val">${p.score || 0}</div>
                        </div>
                        <div class="score-controls">
                            <button class="btn-score" onclick="adjustScore(${index}, -1)">-</button>
                            <button class="btn-score" onclick="adjustScore(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        // Initialize Audio Context for evaluation sound cues
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);       // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                
                osc.start(now);
                osc.stop(now + 0.45);
            } 
            else if (type === 'wrong') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        function triggerVibration(pattern = 200) {
            if ("vibrate" in navigator) {
                try {
                    navigator.vibrate(pattern);
                } catch (err) {
                    console.log("Vibration not supported:", err);
                }
            }
        }

        function handleCorrectBuzzer() {
            playSound('correct');
            triggerVibration([100, 50, 100]);
            socket.emit('hostAction', { type: 'correct' });
        }

        function handleWrongBuzzer() {
            playSound('wrong');
            triggerVibration(400);
            socket.emit('hostAction', { type: 'wrong' });
        }

        function updateGameTitle() {
            const val = document.getElementById('gameTitleInput').value;
            socket.emit('hostAction', { type: 'updateTitle', title: val });
        }

        function adjustScore(index, delta) {
            socket.emit('hostAction', { type: 'adjustScore', index: index, delta: delta });
        }

        function lockAllPlayers() {
            socket.emit('hostAction', { type: 'lockAll' });
        }

        function unlockAllPlayers() {
            socket.emit('hostAction', { type: 'unlockAll' });
        }

        function confirmResetScores() {
            if (confirm("Are you sure you want to reset all player scores to 0?")) {
                socket.emit('hostAction', { type: 'resetScores' });
            }
        }
    </script>
</body>
</html>
