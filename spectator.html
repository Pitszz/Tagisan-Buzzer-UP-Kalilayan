<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagisan 41 Quiz Show - Spectator Display</title>
    <link rel="stylesheet" href="tagisan.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px 32px;
            background-color: var(--cream);
        }
    </style>
</head>
<body>

<div class="spectator-stage">
        <!-- Centered Top Stage Header -->
        <div class="spectator-header">
            <div class="spectator-brand-left">
                <div class="spectator-logos">
                    <img src="assets/brand/tagisan-logo.png" alt="Tagisan 41" onerror="this.style.display='none'">
                    <img src="assets/brand/upk-logo.png" alt="UP Kalilayan" onerror="this.style.display='none'">
                </div>
                <div class="spectator-brand-text">
                    <h1 id="displayTitle">Tagisan 41 Quiz Show</h1>
                    <div class="spectator-sub">Paghasa ng Bayan &bull; 41st Edition</div>
                </div>
            </div>
        </div>

        <!-- Teams Container Wrapper with Overlapping Round Badge -->
        <div class="teams-stage-wrapper">
            <div class="round-status-tag">FINAL ROUND</div>
            <div id="teamsContainer" class="teams-container">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script src="back-navigation.js"></script>
    <script>
        const socket = io();
        setupBackToMenuFallback({ getSocket: () => socket });
        const DEFAULT_SCHOOL_LOGO = 'assets/brand/upk-logo.png';
        let previousBuzzState = {}; // Track who was buzzed previously
        let schoolLogos = {};
        let schoolLogosLoaded = false;
        let latestGameState = null;

        socket.on('schoolLogos', (logos) => {
            schoolLogos = logos || {};
            schoolLogosLoaded = true;
            if (latestGameState) {
                renderGameState(latestGameState);
            }
        });

        function getSchoolLogoHTML(schoolName) {
            // "Quezon Science High School" -> "quezon-science-high-school"
            const slug = (schoolName || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');

            const logoSrc = slug
                ? (schoolLogos[slug] || (schoolLogosLoaded ? DEFAULT_SCHOOL_LOGO : `assets/logos/${slug}.png`))
                : DEFAULT_SCHOOL_LOGO;
            const altText = schoolName || 'Tagisan 41';
            return `<img src="${logoSrc}" alt="${altText}" onerror="this.onerror=null;this.src='${DEFAULT_SCHOOL_LOGO}';">`;
        }

        // Initialize the browser's Audio Context
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Programmatically synthesize quiz show sounds
        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'buzz') {
                // Sharp Arcade Buzzer Beep
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(160, now + 0.25);
                
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                
                osc.start(now);
                osc.stop(now + 0.25);
            } 
            else if (type === 'correct') {
                // Pleasant Upward Chime (Major Arpeggio)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);       // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                
                osc.start(now);
                osc.stop(now + 0.45);
            } 
            else if (type === 'wrong') {
                // Low Descending Error Thud/Buzz
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        function renderGameState(gameState) {
            const titleEl = document.getElementById('displayTitle');
            if (gameState.title) {
                titleEl.textContent = gameState.title;
                const match = gameState.title.match(/^(.*?)\s+(quiz show.*)$/i);
                // if (match) {
                //     titleEl.innerHTML = `<span class="title-line-1">${match[1]}</span><span class="title-line-2">${match[2]}</span>`;
                // } else {
                //     titleEl.innerHTML = `<span class="title-line-1">${gameState.title}</span>`;
                // }
            }

            const containerEl = document.getElementById('teamsContainer');
            containerEl.innerHTML = '';

            if (!gameState.players || gameState.players.length === 0) {
                containerEl.innerHTML = `<div class="waiting-message" style="display:inline-flex; align-items:center; justify-content:center; width:90%; height:fit-content; margin:auto; padding:0.75rem 1.5rem; font-family:var(--font-display); font-size:0.95rem; color:var(--halftone); text-transform:uppercase; letter-spacing:0.04em; border:2px dashed var(--newsprint); background:transparent; box-shadow:none; font-style: italic;">WAITING FOR TEAMS TO JOIN...</div>`;
                return;
            }

            gameState.players.forEach((p) => {
                const column = document.createElement('div');
                const isBuzzed = p.status === 'buzzed';
                column.className = `team-column ${isBuzzed ? 'buzzed' : ''}`;

                column.innerHTML = `
                    <div class="team-header-group">
                        <div class="team-number-badge">Team #${p.number}</div>
                        <div class="team-school" title="${p.school}">${p.school}</div>
                    </div>
                    <div class="school-logo">
                        ${getSchoolLogoHTML(p.school)}
                    </div>
                `;
                    // remove score for now sa spectator
                    // <div class="team-score-section">
                    //     <div class="score-label">Score</div>
                    //     <div class="score-val">${p.score || 0}</div>
                    // </div>
                containerEl.appendChild(column);
            });
        }

        socket.on('updateState', (gameState) => {
            latestGameState = gameState;
            const currentBuzzState = {};

            if (gameState.players) {
                gameState.players.forEach((p) => {
                    // Check if a player just buzzed in
                    if (p.status === 'buzzed') {
                        currentBuzzState[p.id] = true;
                        if (!previousBuzzState[p.id]) {
                            playSound('buzz'); 
                        }
                    }
                });
            }
            previousBuzzState = currentBuzzState; // Update state tracker

            renderGameState(gameState);
        });
    </script>
</body>
</html>
