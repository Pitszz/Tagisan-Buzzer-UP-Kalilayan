<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagisan 41 Quiz Show - Spectator Display</title>
    <link rel="stylesheet" href="tagisan.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px 32px;
            background-color: var(--cream);
        }

        .spectator-logos img {
            height: 64px;
            width: auto;
            object-fit: contain;
        }

        .spectator-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--red);
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .spectator-brand-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .spectator-brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .spectator-brand-text h1 {
            font-size: clamp(2rem, 3.5vw, 3.2rem);
            line-height: 0.9;
            text-align: left;
            margin: 0;
        }

        .spectator-sub {
            font-family: var(--font-display);
            font-size: 0.85rem;
            color: var(--red);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 900;
            opacity: 0.85;
        }

        .round-status-tag {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 900;
            color: var(--red);
            background: var(--tape);
            border: 2px solid var(--red);
            padding: 8px 18px;
            transform: rotate(1deg);
            box-shadow: 2px 2px 0 var(--newsprint);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="spectator-stage">
        <!-- Top Stage Header -->
        <div class="spectator-header">
            <div class="spectator-brand-left">
                <div class="spectator-logos">
                    <img src="assets/brand/logo-triangle.png" alt="Tagisan 41" onerror="this.style.display='none'">
                    <img src="assets/brand/kalilayan-seal.png" alt="UP Kalilayan" onerror="this.style.display='none'">
                </div>
                <div class="spectator-brand-text">
                    <h1 id="displayTitle">Tagisan 41 Quiz Show</h1>
                    <div class="spectator-sub">UP Kalilayan &bull; Paghasa ng Bayan</div>
                </div>
            </div>
            <div class="round-status-tag">FINAL ROUND</div>
        </div>

        <!-- Teams Split Container (Up to 5 Columns) -->
        <div id="teamsContainer" class="teams-container">
            <!-- Dynamically populated -->
        </div>
    </div>

    <script>
        const socket = io();
        let previousBuzzState = {}; // Track who was buzzed previously

        function getSchoolLogoHTML(schoolName) {
            if (!schoolName) return '';

            // "Quezon Science High School" -> "quezon-science-high-school"
            const slug = schoolName
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');

            return `<img src="assets/logos/${slug}.png" alt="${schoolName}" onerror="this.style.display='none'">`;
        }

        // Initialize the browser's Audio Context
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Programmatically synthesize quiz show sounds
        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'buzz') {
                // Sharp Arcade Buzzer Beep
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(160, now + 0.25);
                
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                
                osc.start(now);
                osc.stop(now + 0.25);
            } 
            else if (type === 'correct') {
                // Pleasant Upward Chime (Major Arpeggio)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);       // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                
                osc.start(now);
                osc.stop(now + 0.45);
            } 
            else if (type === 'wrong') {
                // Low Descending Error Thud/Buzz
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        socket.on('updateState', (gameState) => {
            const currentBuzzState = {};

            if (gameState.players) {
                gameState.players.forEach((p) => {
                    // Check if a player just buzzed in
                    if (p.status === 'buzzed') {
                        currentBuzzState[p.id] = true;
                        if (!previousBuzzState[p.id]) {
                            playSound('buzz'); 
                        }
                    }
                });
            }
            previousBuzzState = currentBuzzState; // Update state tracker

            const titleEl = document.getElementById('displayTitle');
            if (gameState.title) {
                titleEl.textContent = gameState.title;
            }

            const containerEl = document.getElementById('teamsContainer');
            containerEl.innerHTML = '';

            if (!gameState.players || gameState.players.length === 0) {
                containerEl.innerHTML = `<div class="waiting-message" style="display:flex; align-items:center; justify-content:center; width:100%; font-family:var(--font-display); font-size:1.3rem; color:var(--halftone); text-transform:uppercase; letter-spacing:0.04em;">Waiting for finalist teams to connect to game...</div>`;
                return;
            }

            gameState.players.forEach((p) => {
                const column = document.createElement('div');
                const isBuzzed = p.status === 'buzzed';
                column.className = `team-column ${isBuzzed ? 'buzzed' : ''}`;

                column.innerHTML = `
                    <div class="team-header-group">
                        <div class="team-school" title="${p.school}">${p.school}</div>
                        <div class="team-number-badge">Team #${p.number}</div>
                    </div>
                    <div class="school-logo">
                        ${getSchoolLogoHTML(p.school)}
                    </div>
                `;
                    // remove score for now sa spectator
                    // <div class="team-score-section">
                    //     <div class="score-label">Score</div>
                    //     <div class="score-val">${p.score || 0}</div>
                    // </div>
                containerEl.appendChild(column);
            });
        });
    </script>
</body>
</html>
