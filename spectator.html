<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagisan 41 Quiz Show - Spectator Display</title>
    <link rel="stylesheet" href="tagisan.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px 32px;
        }
    </style>
</head>
<!-- Remove "use-page-bg" below to disable assets/bg/spectator-bg.png on this page -->
<body class="page-spectator use-page-bg">

<div class="spectator-stage">
        <!-- Centered Top Stage Header -->
        <div class="spectator-header">
            <div class="spectator-brand-left">
                <div class="spectator-logos">
                    <img src="assets/brand/tagisan-logo.png" alt="Tagisan 41" onerror="this.style.display='none'">
                    <img src="assets/brand/upk-logo.png" alt="UP Kalilayan" onerror="this.style.display='none'">
                </div>
                <div class="spectator-brand-text">
                    <h1 id="displayTitle">Tagisan 41 Quiz Show</h1>
                    <div class="spectator-sub">Paghasa ng Bayan &bull; UP Kalilayan</div>
                </div>
            </div>
            <button type="button" id="fullscreenBtn" class="fullscreen-btn spectator-fullscreen-btn hidden" aria-label="Enter fullscreen" title="Fullscreen">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
            </button>
        </div>

        <!-- Teams Container Wrapper with Overlapping Round Badge -->
        <div class="teams-stage-wrapper">
            <div class="round-status-tag">FINAL ROUND</div>
            <div id="teamsContainer" class="teams-container">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script src="back-navigation.js"></script>
    <script src="client-utils.js"></script>
    <script>
        // ====================================================
        // 1. CONNECTION & NAVIGATION SETUP
        // ====================================================
        const socket = io();
        setupBackToMenuFallback({ getSocket: () => socket });
        setupFullscreenButton('fullscreenBtn');

        const DEFAULT_SCHOOL_LOGO = 'assets/brand/upk-logo.png';
        let previousBuzzState = {}; // Track buzzed schools (not socket IDs) so reconnects don't replay audio
        let hasInitialState = false;
        let schoolLogos = {};
        let schoolLogosLoaded = false;
        let latestGameState = null;

        // ====================================================
        // 2. SCHOOL LOGO RESOLUTION
        // ====================================================
        socket.on('schoolLogos', (logos) => {
            schoolLogos = logos || {};
            schoolLogosLoaded = true;
            if (latestGameState) {
                renderGameState(latestGameState);
            }
        });

        function getSchoolLogoHTML(schoolName) {
            // Match README slug format: "Quezon Science High School" -> "quezon-science-high-school"
            const slug = (schoolName || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');

            const logoSrc = slug
                ? (schoolLogos[slug] || (schoolLogosLoaded ? DEFAULT_SCHOOL_LOGO : `assets/logos/${slug}.png`))
                : DEFAULT_SCHOOL_LOGO;
            const altText = schoolName || 'Tagisan 41';
            return `<img src="${logoSrc}" alt="${altText}" onerror="this.onerror=null;this.src='${DEFAULT_SCHOOL_LOGO}';">`;
        }

        // Standard competition ranking (1, 2, 2, 4); teams at 0 get no rank or highlight
        function getTeamRanks(players) {
            const positiveScores = (players || [])
                .map(p => Number(p.score) || 0)
                .filter(score => score > 0)
                .sort((a, b) => b - a);

            return (players || []).map((p) => {
                const score = Number(p.score) || 0;
                if (score <= 0) return null;
                return positiveScores.indexOf(score) + 1;
            });
        }

        function formatRankLabel(rank) {
            if (rank === 1) return '1ST';
            if (rank === 2) return '2ND';
            if (rank === 3) return '3RD';
            return `${rank}TH`;
        }

        // ====================================================
        // 3. STAGE RENDERING & BUZZ AUDIO CUE
        // ====================================================
        function renderGameState(gameState) {
            const titleEl = document.getElementById('displayTitle');
            if (gameState.title) {
                titleEl.textContent = gameState.title;
            }

            const containerEl = document.getElementById('teamsContainer');
            containerEl.innerHTML = '';

            if (!gameState.players || gameState.players.length === 0) {
                containerEl.innerHTML = `<div class="waiting-message" style="display:inline-flex; align-items:center; justify-content:center; width:90%; height:fit-content; margin:auto; padding:0.75rem 1.5rem; font-family:var(--font-display); font-size:0.95rem; color:var(--halftone); text-transform:uppercase; letter-spacing:0.04em; border:2px dashed var(--newsprint); background:transparent; box-shadow:none; font-style: italic;">WAITING FOR TEAMS TO JOIN...</div>`;
                return;
            }

            const showScores = Boolean(gameState.showScores);
            const ranks = showScores ? getTeamRanks(gameState.players) : [];

            gameState.players.forEach((p, idx) => {
                const column = document.createElement('div');
                const isBuzzed = p.status === 'buzzed';
                const rank = showScores ? ranks[idx] : null;
                const podiumClass = (rank && rank <= 3) ? `rank-${rank}` : '';

                column.className = `team-column${showScores ? ' with-scores' : ''}${podiumClass ? ` ${podiumClass}` : ''}${isBuzzed ? ' buzzed' : ''}`;

                const scoreSectionHTML = showScores ? `
                    <div class="team-score-section">
                        <div class="score-label">Score</div>
                        <div class="score-val">${p.score || 0}</div>
                        <div class="rank-slot">
                            ${rank ? `<span class="rank-badge ${rank <= 3 ? `rank-${rank}` : 'rank-other'}">${formatRankLabel(rank)}</span>` : ''}
                        </div>
                    </div>
                ` : '';

                column.innerHTML = `
                    <div class="team-header-group">
                        <div class="team-number-badge">Team #${p.number}</div>
                        <div class="team-school" title="${p.school}">${p.school}</div>
                    </div>
                    <div class="school-logo">
                        ${getSchoolLogoHTML(p.school)}
                    </div>
                    ${scoreSectionHTML}
                `;
                containerEl.appendChild(column);
            });
        }

        socket.on('updateState', (gameState) => {
            latestGameState = gameState;
            const currentBuzzState = {};

            if (gameState.players) {
                gameState.players.forEach((p) => {
                    if (p.status === 'buzzed') {
                        const teamKey = String(p.school || '').trim().toLowerCase();
                        currentBuzzState[teamKey] = true;
                        if (hasInitialState && !previousBuzzState[teamKey]) {
                            playSound('buzz');
                            triggerVibration(200);
                        }
                    }
                });
            }
            previousBuzzState = currentBuzzState;
            hasInitialState = true;

            renderGameState(gameState);
        });
    </script>
</body>
</html>
