<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagisan 41 Quiz Show - Main Menu</title>
    <link rel="stylesheet" href="tagisan.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 24px 0 0 0;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto 0;
            padding: 16px;
        }

        /* Dual Logo Header: Inverted Triangle + UP Kalilayan Seal */
        .logo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .logo-container {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-triangle-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(2px 3px 0 var(--newsprint));
        }

        .logo-seal-img {
            width: 68px;
            height: 68px;
            object-fit: contain;
        }

        .title-group {
            text-align: center;
            margin-bottom: 24px;
        }

        .title-kicker {
            font-family: var(--font-display);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            color: var(--red);
            text-transform: uppercase;
            font-weight: 900;
            display: block;
            margin-bottom: 4px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 2.75rem);
            line-height: 0.9;
        }

        .subtitle-tagline {
            font-family: var(--font-display);
            font-size: 0.75rem;
            color: var(--red);
            letter-spacing: 0.08em;
            margin-top: 6px;
            font-weight: 900;
            opacity: 0.85;
            text-transform: uppercase;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-btn-join {
            font-size: 1.25rem;
            padding: 18px 20px;
        }

        #schoolSelectLabel {
            display: block;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dual Brand Mark: Inverted Triangle Logo & UP Kalilayan Seal -->
        <div class="logo-header">
            <div class="logo-container" id="logoWrapper">
                <img src="assets/brand/tagisan-logo.png" alt="Tagisan 41 Triangle Logo" class="logo-triangle-img" onerror="this.outerHTML='<div class=\'temp-triangle\'></div>'">
            </div>
            <div class="logo-container">
                <img src="assets/brand/upk-logo.png" alt="UP Kalilayan Seal" class="logo-seal-img" onerror="this.style.display='none'">
            </div>
        </div>

        <div class="title-group">
            <span class="title-kicker">UP KALILAYAN PRESENTS</span>
            <h1>Tagisan 41<br>Quiz Show</h1>
            <div class="subtitle-tagline">Paghasa ng Bayan &bull; 41st Edition</div>
        </div>

        <!-- PERSISTENT PROFILE QUICK-JOIN CARD (Hidden by default) -->
        <div id="savedProfileCard" class="card card-taped hidden">
            <div class="tape-strip" style="align-self: flex-start; margin-bottom: -6px;">WELCOME BACK!</div>
            <div id="savedProfileText" class="info-text"></div>
            <button class="primary menu-btn-join" onclick="joinWithSavedProfile()">Rejoin</button>
            <button class="secondary" onclick="clearSavedProfile()">Back to Menu</button>
        </div>

        <!-- VIEW 1: MAIN MENU (CHUNKY TORN-PAPER SLABS) -->
        <div id="mainMenu" class="card card-taped">
            <div class="menu-options">
                <button class="primary menu-btn-join" onclick="switchView('join')">JOIN</button>
                <button class="secondary" onclick="switchView('host')">HOST</button>
                <button class="secondary" onclick="switchView('spectate')">SPECTATE</button>
            </div>
        </div>

        <!-- VIEW 2: JOIN CONFIGURATION -->
        <div id="joinView" class="card card-taped hidden">
            <label for="schoolSelect">School</label>
            <div class="custom-select-wrapper" id="schoolDropdown">
                <input type="hidden" id="schoolSelect" value="">
                <button type="button" class="custom-select-trigger" id="schoolSelectTrigger">
                    <span id="schoolSelectLabel">- CHOOSE YOUR SCHOOL -</span>
                    <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="custom-select-menu hidden" id="schoolSelectMenu">
                    <!-- Populated dynamically from schoolList -->
                </div>
            </div>

            <!-- Custom Input for 'Other' (Hidden by default) -->
            <div id="customSchoolContainer" class="hidden" style="margin-top: 4px; display: flex; flex-direction: column; gap: 8px;">
                <label for="customSchoolInput" style="display: block; margin-bottom: 1px;">Enter School Name</label>
                <input type="text" id="customSchoolInput" placeholder="UP Diliman...">
            </div>

            <label for="playerNumber" style="margin-top: 4px;">Assigned Number</label>
            <div class="number-stepper">
            <input type="number" id="teamNumberInput" min="1" max="99" value="1" required>
            <div class="stepper-arrows">
                <button type="button" class="stepper-btn" onclick="stepTeamNumber(1)" aria-label="Increase Team Number">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square">
                        <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
                </button>
                <button type="button" class="stepper-btn" onclick="stepTeamNumber(-1)" aria-label="Decrease Team Number">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>
        </div>

            <button class="primary menu-btn-join" onclick="handleJoinGame()">Connect</button>
            <button class="secondary" onclick="switchView('mainMenu')">Back to Menu</button>
        </div>

        <!-- VIEW 3: WAITING FOR HOST STATE -->
        <div id="waitingView" class="card card-taped hidden">
            <div class="info-text">
                <p id="waitingStatusText">Checking for active hosted game...</p>
            </div>
            <button class="secondary" onclick="switchView('mainMenu')">Cancel</button>
        </div>

        <!-- VIEW 4: HOST PASSWORD PROMPT -->
        <div id="hostLoginView" class="card card-taped hidden">
            <!-- <div class="tape-strip" style="align-self: flex-start; margin-bottom: -6px;">HOST ACCESS</div> -->
            <label for="hostPasswordInput" style="margin-bottom: 1px;">Enter Password</label>
            <input type="password" id="hostPasswordInput" placeholder="••••••••" onkeydown="if (event.key === 'Enter') verifyHostLogin()">
            <div id="hostLoginError" class="hidden" style="color: var(--red); font-size: 0.85rem; text-transform: uppercase;">
                Incorrect password. Try again.
            </div>
            <button class="primary menu-btn-join" onclick="verifyHostLogin()">Connect</button>
            <button class="secondary" onclick="switchView('mainMenu')">Back to Menu</button>
        </div>

    </div>

    <!-- Red Ink-Splash Footer Strip -->
    <footer class="tagisan-footer">
        <a href="https://instagram.com/upkalilayan" target="_blank" rel="noopener noreferrer">@UPKALILAYAN</a>
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const dropdownWrapper = document.getElementById('schoolDropdown');
        const dropdownTrigger = document.getElementById('schoolSelectTrigger');
        const dropdownMenu = document.getElementById('schoolSelectMenu');
        const dropdownLabel = document.getElementById('schoolSelectLabel');
        const hiddenSchoolInput = document.getElementById('schoolSelect');

        dropdownTrigger.addEventListener('click', () => {
            dropdownWrapper.classList.toggle('open');
            dropdownMenu.classList.toggle('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!dropdownWrapper.contains(e.target)) {
                dropdownWrapper.classList.remove('open');
                dropdownMenu.classList.add('hidden');
            }
        });

        socket.on('schoolList', (schools) => {
            dropdownMenu.innerHTML = '';
            const allOptions = [...schools, 'OTHER'];

            allOptions.forEach((school) => {
                const item = document.createElement('div');
                item.className = 'custom-select-option';
                item.textContent = school;

                item.addEventListener('click', () => {
                    hiddenSchoolInput.value = school;
                    dropdownLabel.textContent = school;

                    dropdownMenu.querySelectorAll('.custom-select-option').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');

                    dropdownWrapper.classList.remove('open');
                    dropdownMenu.classList.add('hidden');

                    handleSchoolChange(); // Directly show/hide the custom school input
                });

                dropdownMenu.appendChild(item);
            });
        });

        function stepTeamNumber(delta) {
            const input = document.getElementById('teamNumberInput');
            const min = parseInt(input.min, 10) || 1;
            const max = parseInt(input.max, 10) || 99;
            const current = parseInt(input.value, 10) || min;
            const next = Math.min(max, Math.max(min, current + delta));
            input.value = next;
        }

        // Show/hide manual input field depending on selection
        function handleSchoolChange() {
            const selectEl = document.getElementById('schoolSelect');
            const customContainer = document.getElementById('customSchoolContainer');
            
            if (selectEl.value === "OTHER") {
                customContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
                document.getElementById('customSchoolInput').value = '';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Check if there is a saved player profile in localStorage
            const savedSchool = localStorage.getItem('quizPlayerSchool');
            const savedNumber = localStorage.getItem('quizPlayerNumber');

            if (savedSchool && savedNumber) {
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('savedProfileCard').classList.remove('hidden');
                document.getElementById('savedProfileText').innerHTML = `<b>${savedSchool}</b> <br>Team #${savedNumber}`;
            }
        });

        function switchView(viewName) {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('joinView').classList.add('hidden');
            document.getElementById('waitingView').classList.add('hidden');
            document.getElementById('hostLoginView').classList.add('hidden');

            if (viewName === 'mainMenu') {
                document.getElementById('mainMenu').classList.remove('hidden');
            } else if (viewName === 'join') {
                document.getElementById('joinView').classList.remove('hidden');
            } else if (viewName === 'host') {
                // If already unlocked in this tab session, go straight in
                if (sessionStorage.getItem('quizHostPassword')) {
                    window.location.href = 'host.html';
                    return;
                }
                document.getElementById('hostLoginError').classList.add('hidden');
                document.getElementById('hostPasswordInput').value = '';
                document.getElementById('hostLoginView').classList.remove('hidden');
                document.getElementById('hostPasswordInput').focus();
            } else if (viewName === 'spectate') {
                window.location.href = 'spectator.html';
            }
        }

        function verifyHostLogin() {
            const password = document.getElementById('hostPasswordInput').value;
            const errorEl = document.getElementById('hostLoginError');

            socket.emit('verifyHost', password, (res) => {
                if (res && res.ok) {
                    sessionStorage.setItem('quizHostPassword', password);
                    window.location.href = 'host.html';
                } else {
                    errorEl.classList.remove('hidden');
                }
            });
        }

        function joinWithSavedProfile() {
            const school = localStorage.getItem('quizPlayerSchool');
            const number = localStorage.getItem('quizPlayerNumber');

            document.getElementById('savedProfileCard').classList.add('hidden');
            document.getElementById('waitingView').classList.remove('hidden');
            document.getElementById('waitingStatusText').textContent = `Rejoining as ${school} #${number}...`;

            setTimeout(() => {
                window.location.href = 'player.html';
            }, 500);
        }

        function clearSavedProfile() {
            localStorage.removeItem('quizPlayerSchool');
            localStorage.removeItem('quizPlayerNumber');
            document.getElementById('savedProfileCard').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        function handleJoinGame() {
            const selectValue = document.getElementById('schoolSelect').value;
            let school = selectValue;

            // If "Other" is selected, grab the text from the manual input box
            if (selectValue === "OTHER") {
                school = document.getElementById('customSchoolInput').value.trim();
            }

            const number = document.getElementById('teamNumberInput').value;

            if (!school || !number) {
                alert('Please select or enter your school and provide your assigned number.');
                return;
            }

            // Save info locally for persistence
            localStorage.setItem('quizPlayerSchool', school);
            localStorage.setItem('quizPlayerNumber', number);

            document.getElementById('joinView').classList.add('hidden');
            document.getElementById('waitingView').classList.remove('hidden');
            document.getElementById('waitingStatusText').textContent = `Joining as ${school} #${number}...`;

            setTimeout(() => {
                window.location.href = 'player.html';
            }, 500);
        }

        function restoreInitialView() {
            const savedSchool = localStorage.getItem('quizPlayerSchool');
            const savedNumber = localStorage.getItem('quizPlayerNumber');

            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('joinView').classList.add('hidden');
            document.getElementById('waitingView').classList.add('hidden');
            document.getElementById('hostLoginView').classList.add('hidden');

            if (savedSchool && savedNumber) {
                document.getElementById('savedProfileCard').classList.remove('hidden');
                document.getElementById('savedProfileText').innerHTML = `<b>${savedSchool}</b> <br>Team #${savedNumber}`;
            } else {
                document.getElementById('savedProfileCard').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', restoreInitialView);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                restoreInitialView();
            }
        });
    </script>
</body>
</html>
